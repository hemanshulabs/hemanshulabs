name: README build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - README.md
      - '*.svg'
      - profile.json
      - today.py
      - cache/requirements.txt
      - .github/workflows/build.yaml
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: write

concurrency:
  group: profile-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cache/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r cache/requirements.txt
      - name: Update profile SVGs
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN || github.token }}
          USER_NAME: ${{ vars.PROFILE_USERNAME || 'hemanshulabs' }}
        run: python today.py
      - name: Commit refreshed data
        run: |
          git add dark_mode.svg light_mode.svg cache/
          if git diff --cached --quiet; then
            echo "Profile data is already up to date."
            exit 0
          fi
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -m "Update profile data"
          git push
